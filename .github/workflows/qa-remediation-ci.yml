name: QA Remediation CI

# Quality gate for the AI Automation engine. Runs automatically on every
# ai-qa/fix-* branch/PR it opens, and can also be dispatched on demand by the
# backend's CI/CD Integration panel (workflow_dispatch, see github.service.js).
on:
  pull_request:
    branches: [main]
  push:
    branches: ["ai-qa/**"]
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL the triggering QA scan was run against"
        required: false
        type: string

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node -e "require('./src/app')" --check
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
